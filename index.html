<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#292d49">
<meta name="quest-version" content="3.4.0">
<meta name="description" content="QUEST — Twój dzień jako RPG">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=3.4.0">
<style id="quest-critical-home">/* Bundled with HTML so dashboard and styles deploy atomically */
/* QUEST 2.9 — focused dashboard, reduced visual noise and subtle motion */
.quest-home{gap:13px;padding-top:2px;padding-bottom:20px}
.home-summary{background:linear-gradient(145deg,#222c45,#1c253b);border:1px solid #36445f;border-radius:17px;padding:15px 15px 8px;animation:quest-rise .38s ease-out both}
.home-summary-top,.home-summary-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.home-summary-top>div:first-child{display:flex;flex-direction:column;gap:4px}
.home-date{font-size:10px;color:#99a9c8;letter-spacing:.7px;text-transform:uppercase}
.home-summary-top strong{font-size:18px;font-weight:720;letter-spacing:-.3px}
.home-xp{font-size:23px;font-weight:800;color:#b8caff;font-variant-numeric:tabular-nums;white-space:nowrap}
.home-xp small{font-size:11px;font-weight:600}
.home-progress{height:6px;background:#111a2d;border-radius:8px;overflow:hidden;margin:15px 0 9px}
.home-progress i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#7b82ed,#9cc4ff);animation:quest-fill .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.home-summary-foot{font-size:11px;color:#9caccb}
.home-mode{background:#2d3852;border:1px solid #44516a;color:#d8e4ff;padding:5px 9px;border-radius:9px;font-size:10px;font-weight:650}
.home-tip{margin-top:11px;padding:10px 0 3px;width:100%;border:0;border-top:1px solid #35415a;background:transparent;color:#eef3ff;display:flex;align-items:center;gap:10px;text-align:left}
.home-tip-star{color:#b9a4f5;font-size:18px}
.home-tip>span:nth-child(2){display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.home-tip b{font-size:11px}
.home-tip small{font-size:10px;color:#a8b8d5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-chevron{font-size:19px;color:#95a9ca;flex-shrink:0}
.home-section-label{display:flex;align-items:center;justify-content:space-between;padding:0 2px;gap:8px}
.home-section-label strong{font-size:13px;color:#e8eeff}
.home-section-label span{font-size:10px;color:#879ab9}
.category-grid.home-categories{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:none!important;grid-auto-rows:64px!important;gap:8px!important}
.home-categories .category-card,.home-categories .category-card.fitness{height:64px!important;min-height:64px!important;grid-column:auto!important;grid-template-columns:25px minmax(0,1fr) 22px!important;grid-template-rows:1fr!important;align-items:center!important;gap:7px!important;padding:11px!important;border-radius:13px;background:color-mix(in srgb,var(--cat-accent) 8%,#1c263a)!important;border:1px solid color-mix(in srgb,var(--cat-accent) 28%,#28364b)!important;transition:transform .17s ease,background .17s ease,border-color .17s ease;animation:quest-rise .38s ease both}
.home-categories .category-card:nth-child(2){animation-delay:35ms}
.home-categories .category-card:nth-child(3){animation-delay:70ms}
.home-categories .category-card:nth-child(4){animation-delay:105ms}
.home-categories .category-card:nth-child(5){animation-delay:140ms}
.home-categories .category-card .cat-icon,.home-categories .category-card.fitness .cat-icon{grid-column:1!important;grid-row:1!important;font-size:21px!important}
.home-categories .category-card .cat-name,.home-categories .category-card.fitness .cat-name{grid-column:2!important;grid-row:1!important;font-size:12px!important;align-self:center!important;overflow-wrap:normal;word-break:normal;line-height:1.2}
.home-categories .category-card .cat-sub{display:none!important}
.home-categories .category-card .cat-foot,.home-categories .category-card.fitness .cat-foot{grid-column:3!important;grid-row:1!important;display:flex!important;align-items:center!important;justify-content:flex-end!important}
.home-categories .category-card .plus{height:21px!important;width:21px!important;background:transparent;font-size:19px!important}
.home-categories .category-card:active{transform:scale(.96);background:color-mix(in srgb,var(--cat-accent) 16%,#1c263a)!important}
.home-actions{display:flex;flex-direction:column;gap:0;background:#1b2539;border:1px solid #303e55;border-radius:14px;overflow:hidden;animation:quest-rise .42s .13s ease both}
.home-action{display:flex;align-items:center;gap:11px;width:100%;padding:12px 13px;border:0;background:transparent;color:#eef3ff;text-align:left;transition:background .18s ease}
.home-action+.home-action{border-top:1px solid #303c53}
.home-action:active{background:#303b55}
.home-action-icon{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;background:#303c59;border-radius:10px;color:#b6c5ff;font-size:19px}
.home-action>span:nth-child(2){display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.home-action b{font-size:12px}
.home-action small{font-size:10px;color:#9eafcc}
.home-log{background:#1b2539;border:1px solid #303e55;border-radius:14px;padding:11px 13px;animation:quest-expand .22s ease-out both}
.home-log .row>strong{font-size:12px}
.home-log .entry{padding:9px 0}
.home-log .muted{margin:9px 0}
.main.today{overflow-y:auto!important}
@keyframes quest-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes quest-expand{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@keyframes quest-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:360px){.home-categories .category-card,.home-categories .category-card.fitness{padding:8px!important;gap:4px!important}.home-categories .category-card .cat-name{font-size:11px!important}.quest-home{gap:10px}}
@media(max-height:690px){.quest-home{gap:9px}.home-summary{padding:11px 12px 7px}.home-progress{margin:10px 0 7px}.home-tip{margin-top:8px;padding-top:7px}.category-grid.home-categories{grid-auto-rows:56px!important}.home-categories .category-card,.home-categories .category-card.fitness{height:56px!important;min-height:56px!important}.home-action{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.quest-home *,.quest-home *::before,.quest-home *::after{animation:none!important;transition:none!important}}

</style>
<title>QUEST 3.4 — Mój dzień</title>
</head>
<body>
<div id="app"><p style="padding:24px;color:#fff;background:#171d30">Ładowanie QUEST 3.4…</p></div>
<script>
window.addEventListener('load',async()=>{
 if(!('serviceWorker' in navigator))return;
 try{
  const registration=await navigator.serviceWorker.register('./sw.js?v=3.4.0',{scope:'./',updateViaCache:'none'});
  registration.update().catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)registration.update().catch(()=>{})});
 }catch(error){console.warn('QUEST PWA registration:',error)}
});
</script>
<script src="./recipes.js?v=3.4.0" defer></script>
<script src="./app.js?v=3.4.0" defer></script>
</body>
</html>

name: QUEST Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'recipes.js'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'version.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Copy bundled offline web app
        run: |
          mkdir -p app/src/main/assets/web
          cp index.html app.js style.css recipes.js icon.svg manifest.webmanifest app/src/main/assets/web/
      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: QUEST-4.0-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
